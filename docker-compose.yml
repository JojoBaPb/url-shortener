# Start everything with:   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener   # fine for local use; use a real secret in production
      POSTGRES_DB: shortener
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps your data when containers restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://shortener:shortener@db:5432/shortener
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # wait until PostgreSQL is really ready

volumes:
  pgdata:
